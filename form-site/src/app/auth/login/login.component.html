<form [formGroup]="form" (ngSubmit)="OnSubmit()">
  <h2>Login</h2>

  <div class="control-row">
    <div class="control no-margin">
      <label for="email">Email</label>
      <input id="email" type="email" name ="email" formControlName="email" />
    </div>

    <div class="control no-margin">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" formControlName="password" />
    </div>
    <button class="button">Login</button>
  </div>

  @if (emailIsInvalid){
    <p class="control-error"> Email is not correctly, please input a valid email.</p>
  }

  @if (passwordIsInvalid){
    <p class="control-error"> Password is not correctly, please input a valid password (at least 5 digits and ?).</p>
  }

</form>
