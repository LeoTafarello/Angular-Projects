<app-card>
    <article>
        <h2> {{task.title}} </h2>
        <time> {{task.dueDate | date: "cccc, dd MMM, yyyy 'at' hh:mm a"}} </time>  <!--Usando o DatePipe para formatar a data como quiser -->
        <p> {{task.summary}} </p>
        <p class="actions">
            <button (click)="onCompleteTask()">Complete</button>
        </p>
    </article>
</app-card>
